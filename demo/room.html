<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FantasyTV in the living room</title>
<meta name="robots" content="noindex">
<style>
  /* A living room photo (img/room.jpg, cropped around its TV) with the FantasyTV demo playing on the TV's screen,
     placed where the screen is in the photo. */
  html, body { margin: 0; height: 100%; background: #07080c; overflow: hidden; }
  .room { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: #07080c url(img/room.jpg) center / 100% 100% no-repeat; }
  /* the TV's screen: x 19.1–81.0%, y 19.4–81.3% of the picture */
  .screen { position: absolute; left: 19.1%; top: 19.4%; width: 61.9%; height: 61.9%; overflow: hidden; background: #000; }
  .screen iframe { display: block; width: 100%; height: 100%; border: 0; pointer-events: none; }
  /* glass: a soft sheen across the top left, and the edges a touch darker, so the picture sits in the panel */
  .screen::after { content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(118deg, rgba(255,255,255,.07) 0%, rgba(255,255,255,.02) 28%, transparent 40%);
    box-shadow: inset 0 0 1.2vw rgba(0,0,0,.45); }
  /* phones: the room would make the overlay too small to read, so just the TV's picture, full size */
  @media (max-width: 560px) {
    .room { background: #000; }
    .screen { inset: 0; width: 100%; height: 100%; }
    .screen::after { display: none; }
  }
</style>
</head>
<body>
<div class="room" aria-label="FantasyTV on a TV in a living room">
  <div class="screen"><iframe src="./" title="FantasyTV switching between games" scrolling="no" tabindex="-1"></iframe></div>
</div>
</body>
</html>
